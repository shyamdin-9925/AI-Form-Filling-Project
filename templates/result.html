{% extends 'base.html' %}

{% block title %}Result | FormAssist{% endblock %}

{% block content %}
<section class="result-card">
  <div class="result-icon">✓</div>
  <p class="eyebrow">Completed</p>
  <h1>Your output is ready</h1>
  <p class="section-text">
    Download the generated file now or return to your dashboard to view previous submissions.
  </p>

  <div class="form-actions centered">
    <form action="/output/download" method="GET">
      <button type="submit" class="btn btn-primary">Download output</button>
    </form>

    <a href="/dashboard/" class="btn btn-secondary">Go to dashboard</a>
  </div>
</section>
{% endblock %}
