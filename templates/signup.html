{% extends 'base.html' %}

{% block title %}Sign up | FormAssist{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <p class="eyebrow">Get started</p>
    <h1>Create your account</h1>
    <p class="section-text">Sign up to upload documents, autofill forms, and track submissions.</p>

    <form action="/auth/signup" method="POST" id="signupForm" class="stack-form">
      <div class="form-field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>

      <div class="form-field">
        <label for="signup-email">Email</label>
        <input id="signup-email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="form-field">
        <label for="signup-password">Password</label>
        <input id="signup-password" name="password" type="password" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p class="helper-text">
      Already have an account? <a href="/login" class="text-link">Log in</a>.
    </p>
  </div>
</section>
{% endblock %}
